name: 更新自动新闻源

on:
  schedule:
    - cron: "17 22 * * *" # 每天北京时间 06:17
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-feeds.mjs
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/feeds.js
          git diff --cached --quiet || git commit -m "chore: 更新自动新闻源"
          git push
